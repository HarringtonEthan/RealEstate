name: Refresh leads

on:
  schedule:
    - cron: "0 11 * * *"   # 7:00 AM Eastern (EDT); runs on the default branch only
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore lead database
        uses: actions/cache@v4
        with:
          path: leaddesk.db
          key: leaddesk-db-${{ github.run_id }}
          restore-keys: leaddesk-db-

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m leaddesk init-db
          python -m leaddesk run-once
          # NOTE: MLS results never appear here — Diane's export file lives on
          # her own computer, not in this cloud runner. This step only ever
          # produces public-records (Wake County / Raleigh) results.

      - name: Commit updated site data
        run: |
          git config user.name "lead-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data || true
          # briefs/ and mls_exports/*.csv are intentionally NOT added — they
          # may contain MLS-licensed listing details and stay local-only.
          if ! git diff --cached --quiet; then
            git commit -m "Daily lead refresh"
            git push
          else
            echo "No changes to publish."
          fi
